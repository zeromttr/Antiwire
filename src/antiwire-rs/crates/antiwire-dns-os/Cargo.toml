[package]
name = "antiwire-dns-os"
description = "OS DNS resolver capture, redirect and restore backends (Linux, macOS, Windows)"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
antiwire-secrets = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# Tests check quoted command lines against the parser child processes use.
windows = { workspace = true, features = ["Win32_UI_Shell"] }
