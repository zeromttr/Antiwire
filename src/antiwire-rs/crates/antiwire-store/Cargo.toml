[package]
name = "antiwire-store"
description = "Embedded libSQL-compatible SQLite persistence for the Antiwire daemon"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
antiwire-policy = { workspace = true }
antiwire-secrets = { workspace = true }
antiwire-tuning = { workspace = true }
aes = "0.8"
aes-gcm = { workspace = true }
base64 = "0.23"
cbc = "0.2"
getrandom = "0.4"
parking_lot = { workspace = true }
lru = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[features]
# Single-row helpers that only tests call; production uses the batch and
# transactional forms.
test-support = []

[dev-dependencies]
tempfile = { workspace = true }
