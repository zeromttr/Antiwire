[package]
name = "netmetrics-windows"
description = "Windows ETW backend for netmetrics"
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true

[dependencies]
netmetrics-core.workspace = true
netmetrics-sys.workspace = true

[target.'cfg(windows)'.dependencies]
arc-swap = "1.7"
ferrisetw = "1.2"
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# WinDivert is x86_64 only: the official package has no ARM64 driver. Other
# architectures build without the downloader and the divert.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
sha2 = "0.10"
socket2 = "0.6"
# The official WinDivert package is fetched in-process: the Windows certificate
# store and proxy settings, explicit timeouts, and no PowerShell.
ureq = { version = "3.4", default-features = false, features = [
    "rustls",
    "platform-verifier",
    "win-system-proxy",
] }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
netmetrics-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
