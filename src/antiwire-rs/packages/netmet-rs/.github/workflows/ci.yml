name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  ebpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install eBPF build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libbpf-dev \
            linux-tools-common \
            linux-tools-generic
          # ubuntu-latest Azure kernels often ship a bpftool wrapper without a
          # matching kernel binary; link a generic tools payload into place.
          KREL="$(uname -r)"
          if ! /usr/sbin/bpftool -V >/dev/null 2>&1; then
            FALLBACK="$(find /usr/lib -type f -name bpftool -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"
            if [[ -z "${FALLBACK}" ]]; then
              echo "bpftool binary not found after installing linux-tools-*"
              exit 1
            fi
            sudo mkdir -p "/usr/lib/linux-tools/${KREL}"
            sudo ln -sf "${FALLBACK}" "/usr/lib/linux-tools/${KREL}/bpftool"
          fi
          /usr/sbin/bpftool -V
      - name: Build CO-RE object
        working-directory: crates/netmetrics-linux/ebpf
        run: sh ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: netmetrics-ebpf-x86_64
          path: crates/netmetrics-linux/ebpf/netmetrics.bpf.o
