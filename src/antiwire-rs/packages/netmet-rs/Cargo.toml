[workspace]
members = [
    "crates/netmetrics",
    "crates/netmetrics-core",
    "crates/netmetrics-sys",
    "crates/netmetrics-windows",
    "crates/netmetrics-linux",
    "crates/netmetrics-macos",
]
default-members = ["crates/netmetrics"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
# The repository this workspace is meant to move to, not the Antiwire project's.
repository = "https://github.com/zeromttr/netmet"

[workspace.dependencies]
netmetrics-core = { version = "0.1.0", path = "crates/netmetrics-core" }
netmetrics-sys = { version = "0.1.0", path = "crates/netmetrics-sys" }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
undocumented_unsafe_blocks = "warn"

