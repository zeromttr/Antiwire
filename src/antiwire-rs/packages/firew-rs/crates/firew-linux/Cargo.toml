[package]
name = "firew-linux"
description = "Linux nftables and iptables backends for firew-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
firew-core.workspace = true
firew-sys.workspace = true
# Not target-gated: the nftables / iptables / ipset rendering and parsing logic
# is pure Rust and is compiled and unit-tested on every host; only host syscalls
# and Linux-only crates are target-gated.
ipnet = "2.11"
nftables = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
iptables = "0.6"

[dev-dependencies]
firew-rs.workspace = true
ipnet = "2.11"
serde_json = "1.0"
