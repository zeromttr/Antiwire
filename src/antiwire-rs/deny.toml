# cargo-deny policy for the antiwire-rs workspace.
# Run from this directory: `cargo deny check`

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Default features only: firew-rs's optional async-std runtime is unused here.
all-features = false

[advisories]
# Fail the check on any unsoundness, CVE, or yanked crate.
unsound = "all"
yanked = "deny"
# Report every unmaintained crate. Known transitive cases that cannot be
# upgraded in-tree are listed in `ignore` with a reason.
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; pulled only by netstat2 → netlink-packet-utils. No drop-in upgrade until netstat2 moves off paste." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained; tonic 0.12 still depends on it. Wait for a tonic upgrade that uses rustls-pki-types PemObject directly." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

# ring's crate license is a conjunction that cargo-deny cannot infer from SPDX alone.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
# Path deps in this unpublished workspace and in nested firew-rs / netmet-rs
# crates have no semver requirement. crates.io third-party deps are versioned
# in [workspace.dependencies]; warn so new `*` pins are still visible.
wildcards = "warn"
allow-wildcard-paths = true
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"

# rustls-only. openssl-probe is allowed: rustls-native-certs uses it on Unix
# to locate the system CA store, not to speak OpenSSL's TLS stack.
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "openssl-src", use-instead = "rustls" },
    { crate = "libressl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
]

# Older lines that remain after skip-tree; keep the newest version of each crate.
skip = [
    { crate = "hashbrown@0.12.3", reason = "older indexmap / hashbrown consumers have not moved off 0.12" },
    { crate = "hashbrown@0.14.5", reason = "dashmap / rusqlite stay on 0.14" },
    { crate = "hashbrown@0.15.5", reason = "transitional hashbrown line" },
    { crate = "base64@0.22.1", reason = "tonic 0.12, reqwest 0.12, and pem 3 require 0.22; ureq 3.4 requires 0.23. Unification needs upstream dependency migrations." },
    { crate = "cpufeatures@0.2.17", reason = "ring / older aes crates still on the 0.2 line" },
    { crate = "ipnetwork@0.20.0", reason = "maxminddb / geo stack have not unified on 0.21" },
    { crate = "prefix-trie@0.8.4", reason = "a transitive consumer still on 0.8; workspace uses 0.9.4" },
    { crate = "core-foundation@0.9.4", reason = "system-configuration 0.7 (hickory-resolver) still on the 0.9 line" },
    { crate = "foldhash@0.1.5", reason = "hashbrown 0.15 still on foldhash 0.1; 0.16+ use 0.2" },
    { crate = "indexmap@1.9.3", reason = "tower 0.4 (tonic 0.12) still depends on indexmap 1" },
    { crate = "rand@0.8.7", reason = "ferrisetw and tower 0.4 still on rand 0.8" },
    { crate = "getrandom@0.2.17", reason = "ring and rand 0.8 still use the getrandom 0.2 API" },
    { crate = "getrandom@0.3.4", reason = "ahash 0.8 still uses the getrandom 0.3 API" },
    { crate = "rand_core@0.6.4", reason = "crypto crates and rand 0.8 still use the rand_core 0.6 API" },
    { crate = "zerocopy@0.7.35", reason = "ferrisetw still uses zerocopy 0.7" },
    { crate = "socket2@0.5.10", reason = "tonic 0.12 still depends on socket2 0.5; the rest of the graph is on 0.6" },
    { crate = "tower@0.4.13", reason = "tonic 0.12 still depends on tower 0.4; reqwest/axum use 0.5" },
]

skip-tree = [
    { crate = "windows-sys", reason = "foundational Windows bindings; version churn is expected and not unifiable" },
    { crate = "windows-targets", reason = "paired with windows-sys version lines" },
    { crate = "windows", reason = "official Windows bindings crate; multiple minor lines in the graph" },
    { crate = "netstat2", reason = "pulls an old netlink/bitflags/nix stack that cannot be unified" },
    { crate = "single-instance", reason = "pulls nix 0.23 and bitflags 1" },
    { crate = "bindgen", reason = "netstat2 build-dep; large independent version tree" },
]

[bans.workspace-dependencies]
# Nested firew-rs / netmet-rs pin some crates themselves; they are not members
# of this workspace and cannot inherit [workspace.dependencies] here.
duplicates = "allow"
include-path-dependencies = false
unused = "allow"

[bans.std-replacements]
scope = "workspace"
level = "warn"
rust-version = "1.90"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
